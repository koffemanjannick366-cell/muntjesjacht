<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muntjesjacht</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; font: 16px system-ui, sans-serif; padding: 24px 0; }
  main { width: min(92vw, 620px); text-align: center; }
  h1 { margin: 0 0 6px; color: #fde047; }
  h2 { margin: 22px 0 8px; color: #fde047; font-size: 21px; }
  p { margin: 6px 0 14px; color: #cbd5e1; }
  #hud { display: flex; justify-content: space-between; margin: 0 auto 8px; max-width: 520px; font-weight: 700; }
  canvas { display: block; width: 100%; max-width: 520px; margin: auto; border: 3px solid #475569; border-radius: 14px; background: #1e293b; }
  .player-form { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px auto 0; }
  input { width: min(240px, 60vw); padding: 10px 12px; border: 2px solid #475569; border-radius: 9px; background: #1e293b; color: white; font: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 9px; background: #fde047; color: #1f2937; font: inherit; font-weight: 800; cursor: pointer; }
  button:hover { background: #facc15; }
  #leaderboard { width: min(100%, 420px); margin: 0 auto; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
  #leaderboard th, #leaderboard td { padding: 9px 12px; border-bottom: 1px solid #334155; text-align: left; }
  #leaderboard th:first-child, #leaderboard td:first-child { width: 52px; text-align: center; }
  #leaderboard th:last-child, #leaderboard td:last-child { text-align: right; }
  #leaderboard tr:last-child td { border-bottom: 0; }
  .touch-controls { display: none; width: 168px; margin: 14px auto 4px; grid-template-columns: repeat(3, 1fr); gap: 7px; touch-action: none; }
  .touch-controls button { margin: 0; min-height: 52px; padding: 8px; font-size: 22px; }
  .touch-controls [data-dir="up"] { grid-column: 2; }
  .touch-controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
  .touch-controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
  .touch-controls [data-dir="right"] { grid-column: 3; grid-row: 2; }
  @media (hover: none), (max-width: 700px) {
    .touch-controls { display: grid; }
    body { padding: 14px 0; }
  }
  .note { font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
<main>
  <h1>🪙 Muntjesjacht</h1>
  <p>Pak zoveel mogelijk muntjes! Beweeg met de pijltjestoetsen of WASD. Je hebt 30 seconden.</p>
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Tijd: <b id="time">30</b></span></div>
  <canvas id="game" width="520" height="360" aria-label="Spelveld"></canvas>
  <div class="touch-controls" aria-label="Bediening">
    <button type="button" data-dir="up" aria-label="Omhoog">▲</button>
    <button type="button" data-dir="left" aria-label="Links">◀</button>
    <button type="button" data-dir="down" aria-label="Omlaag">▼</button>
    <button type="button" data-dir="right" aria-label="Rechts">▶</button>
  </div>
  <div class="player-form">
    <label for="playerName">Jouw naam:</label>
    <input id="playerName" maxlength="16" placeholder="Typ je naam" autocomplete="nickname">
    <button id="start">Start / opnieuw</button>
  </div>
  <h2>🏆 Scorebord</h2>
  <table id="leaderboard" aria-label="Beste scores">
    <thead><tr><th>#</th><th>Naam</th><th>Score</th></tr></thead>
    <tbody id="scores"></tbody>
  </table>
  <p class="note">Scores worden bewaard in deze browser op dit apparaat.</p>
</main>
<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const scoreLabel = document.querySelector('#score');
const timeLabel = document.querySelector('#time');
const nameInput = document.querySelector('#playerName');
const keys = new Set();
const scoreStorageKey = 'muntjesjacht-scores-v1';
let player, coin, score, seconds, active, timer, playerName = '';
const size = 22;
nameInput.value = localStorage.getItem('muntjesjacht-player-name') || '';
function getScores() {
  try { return JSON.parse(localStorage.getItem(scoreStorageKey) || '[]'); }
  catch { return []; }
}
function showScores() {
  const body = document.querySelector('#scores');
  body.replaceChildren();
  getScores().slice(0, 10).forEach((entry, index) => {
    const row = document.createElement('tr');
    const rank = document.createElement('td'); rank.textContent = index + 1;
    const name = document.createElement('td'); name.textContent = entry.name;
    const points = document.createElement('td'); points.textContent = entry.score;
    row.append(rank, name, points); body.append(row);
  });
  if (!body.children.length) {
    const row = document.createElement('tr');
    const cell = document.createElement('td'); cell.colSpan = 3; cell.textContent = 'Nog geen scores — speel als eerste!';
    row.append(cell); body.append(row);
  }
}
function saveScore() {
  const scores = getScores();
  scores.push({ name: playerName, score });
  scores.sort((a, b) => b.score - a.score);
  try { localStorage.setItem(scoreStorageKey, JSON.stringify(scores.slice(0, 10))); }
  catch { /* Het spel blijft speelbaar als de browser opslag blokkeert. */ }
  showScores();
}
function randomCoin() {
  return { x: 12 + Math.random() * (canvas.width - 24), y: 12 + Math.random() * (canvas.height - 24) };
}
function reset() {
  const enteredName = nameInput.value.trim().replace(/\s+/g, ' ');
  if (!enteredName) {
    nameInput.focus();
    nameInput.setCustomValidity('Vul eerst je naam in om te spelen.');
    nameInput.reportValidity();
    return;
  }
  nameInput.setCustomValidity('');
  playerName = enteredName.slice(0, 16);
  nameInput.value = playerName;
  try { localStorage.setItem('muntjesjacht-player-name', playerName); } catch { /* optioneel bewaren */ }
  clearInterval(timer);
  player = { x: canvas.width / 2, y: canvas.height / 2 };
  coin = randomCoin(); score = 0; seconds = 30; active = true;
  scoreLabel.textContent = score; timeLabel.textContent = seconds;
  timer = setInterval(() => {
    seconds--; timeLabel.textContent = seconds;
    if (seconds <= 0) { active = false; clearInterval(timer); saveScore(); draw(); }
  }, 1000);
  requestAnimationFrame(loop);
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#334155';
  for (let x = 20; x < canvas.width; x += 40) for (let y = 20; y < canvas.height; y += 40) ctx.fillRect(x, y, 2, 2);
  if (active) {
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(coin.x, coin.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a16207'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('€', coin.x, coin.y);
  }
  ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.roundRect(player.x - size/2, player.y - size/2, size, size, 7); ctx.fill();
  ctx.fillStyle = '#0c4a6e'; ctx.beginPath(); ctx.arc(player.x - 4, player.y - 2, 2, 0, Math.PI*2); ctx.arc(player.x + 4, player.y - 2, 2, 0, Math.PI*2); ctx.fill();
  if (!active) {
    ctx.fillStyle = 'rgba(15, 23, 42, .82)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 34px system-ui'; ctx.fillText('Tijd is om!', canvas.width/2, canvas.height/2 - 18);
    ctx.font = '20px system-ui'; ctx.fillText(`${playerName || 'Speler'} scoorde ${score} muntjes`, canvas.width/2, canvas.height/2 + 24);
  }
}
function loop() {
  if (!active) return;
  const speed = 4;
  if (keys.has('ArrowUp') || keys.has('w')) player.y -= speed;
  if (keys.has('ArrowDown') || keys.has('s')) player.y += speed;
  if (keys.has('ArrowLeft') || keys.has('a')) player.x -= speed;
  if (keys.has('ArrowRight') || keys.has('d')) player.x += speed;
  player.x = Math.max(size/2, Math.min(canvas.width-size/2, player.x));
  player.y = Math.max(size/2, Math.min(canvas.height-size/2, player.y));
  if (Math.hypot(player.x - coin.x, player.y - coin.y) < 25) {
    score++; scoreLabel.textContent = score; coin = randomCoin();
  }
  draw(); requestAnimationFrame(loop);
}
addEventListener('keydown', e => { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); keys.add(e.key.toLowerCase()); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
nameInput.addEventListener('input', () => nameInput.setCustomValidity(''));
document.querySelectorAll('.touch-controls button').forEach(button => {
  const directionKeys = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
  const key = directionKeys[button.dataset.dir];
  const release = event => { event.preventDefault(); keys.delete(key); };
  button.addEventListener('pointerdown', event => {
    event.preventDefault();
    keys.add(key);
    button.setPointerCapture(event.pointerId);
  });
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('lostpointercapture', () => keys.delete(key));
});
document.querySelector('#start').addEventListener('click', reset);
showScores();
draw();
</script>
</body>
</html>
